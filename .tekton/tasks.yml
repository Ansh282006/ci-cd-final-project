apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all the files.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: registry.access.redhat.com/ubi8/ubi
      script: |
        #!/usr/bin/env bash
        set -e
        echo "Cleaning up workspace..."
        rm -rf $(workspaces.source.path)/*
        echo "Cleanup completed."

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task runs unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: nose
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        echo "Installing dependencies..."
        pip install --no-cache-dir -r requirements.txt nose
        echo "Running unit tests with nose..."
        nosetests -v --with-coverage --cover-package=.
